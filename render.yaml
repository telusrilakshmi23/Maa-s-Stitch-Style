services:
  - type: web
    name: maas-stitch-style-api
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @maas/server build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: maas-stitch-style-db
          property: connectionString
      - key: CLIENT_ORIGINS
        value: ""
      - key: SESSION_SECRET
        generateValue: true
      - key: BUSINESS_WHATSAPP_NUMBER
        sync: false
      - key: BUSINESS_PHONE
        sync: false
      - key: BUSINESS_EMAIL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_REFERENCE_BUCKET
        sync: false
      - key: S3_PRODUCT_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: maas-stitch-style-db
    databaseName: maas_stitch_style
    user: maas_stitch_style
    plan: basic-256mb
